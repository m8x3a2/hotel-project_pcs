# КР3: PostgreSQL + Spring Boot backend гостиницы.
#
# Запуск из корня проекта (там лежит .env):
#   docker compose --env-file .env -f backend/docker-compose.yml up -d --build --wait
# или скриптом:  powershell -ExecutionPolicy Bypass -File .\backend\start-compose.ps1
#
# Остановка без потери данных:  docker compose --env-file .env -f backend/docker-compose.yml down
# (данные лежат в именованном томе hotel_pgdata; удаляет их только down -v)

name: hotel-booking

services:

  # ------------------------------------------------------------
  # PostgreSQL - отдельный сервис
  # ------------------------------------------------------------
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB не задан в .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER не задан в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
    volumes:
      - hotel_pgdata:/var/lib/postgresql/data
    ports:
      # порт открыт только для этого компьютера (127.0.0.1), из сети недоступен
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  # ------------------------------------------------------------
  # Spring Boot REST API - отдельный сервис, образ собирается из backend/Dockerfile
  # ------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: hotel-booking-backend:1.0.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?JWT_SECRET_BASE64 не задан в .env}
      JWT_ISSUER: ${JWT_ISSUER:-hotel-booking}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL не задан в .env}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-System Administrator}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD не задан в .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PERMANENT_DELETE_ENABLED: ${PERMANENT_DELETE_ENABLED:-true}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Europe/Moscow}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      # в образе нет curl, поэтому HTTP-запрос к /actuator/health делаем средствами bash
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  hotel_pgdata:
